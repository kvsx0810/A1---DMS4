name = "hem-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
# where the game is hosted; requests from anywhere else are refused
ALLOWED_ORIGINS = "https://kvsx0810.github.io"
# cheapest Gemini text model ($0.10 / $0.40 per 1M tokens); if it is retired the Worker picks the newest Flash-Lite
MODEL = "gemini-2.5-flash-lite"
# the API key is a secret, never stored here: npx wrangler secret put GEMINI_API_KEY
